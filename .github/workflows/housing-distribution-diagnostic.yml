name: Housing distribution source diagnostic

on:
  push:
    branches: [analysis/near-median-income]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect AHS national CSV files
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/ahs
          for year in 1980 1989 1993 2001 2009 2017 2021 2023; do
            echo "===== INDEX $year ====="
            curl -LsSf "https://www2.census.gov/programs-surveys/ahs/$year/" -o "/tmp/ahs/index-$year.html"
            grep -Eio 'href="[^"]+CSV[^"]*\.zip"' "/tmp/ahs/index-$year.html" | head -20 || true
          done

      - name: Inspect modern ACS housing PUMS headers
        shell: bash
        run: |
          set -euxo pipefail
          for year in 2024 2025; do
            yy=${year:2:2}
            url="https://www2.census.gov/programs-surveys/acs/data/pums/$year/1-Year/csv_hus.zip"
            echo "FETCH $url"
            curl -LsSf "$url" -o "/tmp/ahs/acs-$year.zip"
            unzip -p "/tmp/ahs/acs-$year.zip" | head -1
          done
