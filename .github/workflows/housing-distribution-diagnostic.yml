name: Inspect AHS 2009 literal codes

on:
  push:
    branches: [analysis/near-median-income]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print literal AHS 2009 values
        shell: bash
        run: |
          python - <<'PY'
          import io, re, zipfile, requests, pandas as pd
          from urllib.parse import urljoin
          base="https://www2.census.gov/programs-surveys/ahs/2009/"
          html=requests.get(base).text
          m=re.search(r'href="([^"]*2009[^"]*National[^"]*Flat%20CSV\.zip)"',html,re.I)
          url=urljoin(base,m.group(1))
          z=zipfile.ZipFile(io.BytesIO(requests.get(url).content))
          n=[x for x in z.namelist() if x.lower().endswith(".csv")][0]
          d=pd.read_csv(z.open(n),usecols=["STATUS","TENURE","VALUE","RENT","WGT90GEO","AMTE","AMTG","AMTO","AMTF","AMTW"],dtype=str,low_memory=False)
          for c in d.columns:
              print("\n",c,"dtype",d[c].dtype)
              print(d[c].value_counts(dropna=False).head(20).to_dict())
              print("examples", [repr(x) for x in d[c].dropna().head(10).tolist()])
          PY
