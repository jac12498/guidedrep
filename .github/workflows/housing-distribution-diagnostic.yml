name: Inspect AHS overlap variables

on:
  push:
    branches: [analysis/near-median-income]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect AHS flat CSV headers and likely variables
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/ahs
          for year in 2009 2017 2021; do
            index="https://www2.census.gov/programs-surveys/ahs/$year/"
            html="/tmp/ahs/index-$year.html"
            curl -LsSf "$index" -o "$html"
            file=$(grep -Eio 'href="[^"]+National[^"]+Flat%20CSV\.zip"' "$html" | head -1 | sed -E 's/^href="//;s/"$//')
            if [ -z "$file" ]; then
              file=$(grep -Eio 'href="[^"]+National[^"]+CSV\.zip"' "$html" | head -1 | sed -E 's/^href="//;s/"$//')
            fi
            echo "YEAR=$year FILE=$file"
            url="${index}${file}"
            curl -LsSf "$url" -o "/tmp/ahs/$year.zip"
            unzip -l "/tmp/ahs/$year.zip" | head -30
            mkdir -p "/tmp/ahs/$year"
            unzip -q "/tmp/ahs/$year.zip" -d "/tmp/ahs/$year"
            for f in /tmp/ahs/$year/*.csv; do
              echo "===== $year $(basename "$f") ====="
              head -1 "$f" | tr ',' '\n' | grep -Ein 'WEIGHT|WGT|VALUE|VALUEH|MARKET|RENT|GROSS|TENURE|TENOWN|OWN|STATUS|CONTROL|OMB' || true
            done
          done
