name: Calculate modern housing distribution belts

on:
  push:
    branches: [analysis/near-median-income]
  workflow_dispatch:

jobs:
  calculate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: python -m pip install --quiet pandas numpy requests

      - name: Calculate ACS housing-value and gross-rent belts
        shell: bash
        run: |
          cat > /tmp/calc_housing.py <<'PY'
          import io, zipfile, requests, numpy as np, pandas as pd

          YEARS=[2008,2016,2019,2021,2024]
          s=requests.Session()
          s.headers.update({"User-Agent":"AEB-housing-distribution/1.0"})

          def get(url):
              r=s.get(url,timeout=180)
              r.raise_for_status()
              return r.content

          def wmedian(x,w):
              x=np.asarray(x,float); w=np.asarray(w,float)
              m=np.isfinite(x)&np.isfinite(w)&(w>0)
              x=x[m]; w=w[m]
              o=np.argsort(x,kind="mergesort"); x=x[o]; w=w[o]
              return float(x[np.searchsorted(np.cumsum(w),w.sum()/2,side="left")])

          def shares(x,w,med,lo,hi):
              x=np.asarray(x,float); w=np.asarray(w,float)
              m=np.isfinite(x)&np.isfinite(w)&(w>0)
              x=x[m]; w=w[m]; d=w.sum()
              return (100*w[x<lo*med].sum()/d,
                      100*w[(x>=lo*med)&(x<=hi*med)].sum()/d,
                      100*w[x>hi*med].sum()/d)

          rows=[]
          for year in YEARS:
              url=f"https://www2.census.gov/programs-surveys/acs/data/pums/{year}/1-Year/csv_hus.zip"
              print("FETCH",url)
              z=zipfile.ZipFile(io.BytesIO(get(url)))
              csvs=[n for n in z.namelist() if n.lower().endswith(".csv")]
              frames=[]
              need={"WGTP","TEN","VALP","GRNTP","ADJHSG"}
              for n in csvs:
                  df=pd.read_csv(z.open(n),usecols=lambda c:c.upper() in need,low_memory=False)
                  df.columns=[c.upper() for c in df.columns]
                  if need.issubset(df.columns):
                      frames.append(df[list(need)])
              if not frames:
                  raise RuntimeError(f"No usable housing CSV found for {year}: {csvs}")
              d=pd.concat(frames,ignore_index=True)
              for c in need: d[c]=pd.to_numeric(d[c],errors="coerce")
              # ACS ADJHSG has six implied decimal places.
              adj=d.ADJHSG/1_000_000.0
              d["VALUE_ADJ"]=d.VALP*adj
              d["GRENT_ADJ"]=d.GRNTP*adj

              owner=d[d.TEN.isin([1,2]) & d.VALUE_ADJ.notna() & (d.VALUE_ADJ>0) & (d.WGTP>0)].copy()
              rent=d[(d.TEN==3) & d.GRENT_ADJ.notna() & (d.GRENT_ADJ>0) & (d.WGTP>0)].copy()

              for measure,sub,col in [("home_value",owner,"VALUE_ADJ"),("gross_rent",rent,"GRENT_ADJ")]:
                  med=wmedian(sub[col],sub.WGTP)
                  for belt,lo,hi in [
                      ("near_90_110",.90,1.10),
                      ("broader_80_120",.80,1.20),
                      ("wide_2_3_2x",2/3,2.0),
                  ]:
                      b,i,a=shares(sub[col],sub.WGTP,med,lo,hi)
                      rows.append([year,measure,belt,med,b,i,a,len(sub),sub.WGTP.sum()])
                  print(year,measure,"median",round(med,2),"n",len(sub),"weighted",round(sub.WGTP.sum()))

          out=pd.DataFrame(rows,columns=["year","measure","belt","median","below_pct","inside_pct","above_pct","sample_n","weighted_units"])
          print("===== HOUSING DISTRIBUTION RESULTS =====")
          print(out.to_csv(index=False,float_format="%.3f"))
          out.to_csv("housing_distribution_modern.csv",index=False,float_format="%.6f")
          PY
          python /tmp/calc_housing.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: housing-distribution-modern
          path: housing_distribution_modern.csv
