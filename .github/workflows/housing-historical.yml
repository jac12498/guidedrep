name: Inspect 1980 AHS value and gross rent

on:
  push:
    branches: [analysis/housing-distribution]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: python -m pip install --quiet pandas requests
      - name: Inspect 1980 value labels and ZRENT
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import io,re,zipfile,requests,pandas as pd
          base="https://www2.census.gov/programs-surveys/ahs/1980/"
          html=requests.get(base).text
          def pick(kind):
              links=re.findall(r'href="([^"]+\.zip)"',html,re.I)
              c=[x for x in links if "National" in x and kind in x]
              return base+c[0]
          csvurl=pick("CSV")
          z=zipfile.ZipFile(io.BytesIO(requests.get(csvurl).content))
          n=[x for x in z.namelist() if x.lower().endswith(".csv")][0]
          d=pd.read_csv(z.open(n),usecols=["STATUS","TENURE","VALUE","RENT","ZRENT","WEIGHT"],dtype=str,low_memory=False)
          for c in d.columns:
              print("\n",c)
              print(d[c].value_counts(dropna=False).head(60).to_dict())

          sasurl=pick("SAS")
          zs=zipfile.ZipFile(io.BytesIO(requests.get(sasurl).content))
          print("\nSAS FILES",zs.namelist()[:100])
          for n in zs.namelist():
              if not n.lower().endswith((".sas",".txt")): continue
              txt=zs.read(n).decode("latin1","ignore")
              hits=[]
              for i,line in enumerate(txt.splitlines()):
                  if re.search(r'\bVALUE\b|XVALUE|ZRENT',line,re.I):
                      hits.append((i,line))
              if hits:
                  print("\n====",n,"====")
                  lines=txt.splitlines()
                  for i,line in hits[:80]:
                      for j in range(max(0,i-3),min(len(lines),i+12)):
                          print(f"{j+1}: {lines[j]}")
                      print("---")
          PY
