name: Calculate full historical housing distributions

on:
  push:
    branches: [analysis/housing-distribution]
  workflow_dispatch:

jobs:
  calculate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: python -m pip install --quiet pandas numpy requests
      - name: Calculate AHS legacy and ACS modern housing belts
        shell: bash
        run: |
          cat > /tmp/housing_history.py <<'PY'
          import io,re,zipfile,requests,numpy as np,pandas as pd
          from urllib.parse import urljoin

          s=requests.Session()
          s.headers.update({"User-Agent":"AEB-housing-history/1.0"})

          def get(url):
              r=s.get(url,timeout=300); r.raise_for_status(); return r.content

          def wmedian(x,w):
              x=np.asarray(x,float); w=np.asarray(w,float)
              m=np.isfinite(x)&np.isfinite(w)&(w>0)
              x=x[m]; w=w[m]
              o=np.argsort(x,kind="mergesort"); x=x[o]; w=w[o]
              return float(x[np.searchsorted(np.cumsum(w),w.sum()/2,side="left")])

          def shares(x,w,med,lo,hi):
              x=np.asarray(x,float); w=np.asarray(w,float)
              m=np.isfinite(x)&np.isfinite(w)&(w>0)
              x=x[m]; w=w[m]; den=w.sum()
              return (100*w[x<lo*med].sum()/den,
                      100*w[(x>=lo*med)&(x<=hi*med)].sum()/den,
                      100*w[x>hi*med].sum()/den)

          BELTS=[("near_90_110",.90,1.10),("broader_80_120",.80,1.20),("wide_2_3_2x",2/3,2.0)]
          rows=[]; diagnostics=[]

          def add(year,endpoint_year,source,measure,x,w,status="canonical",note=""):
              x=np.asarray(x,float); w=np.asarray(w,float)
              m=np.isfinite(x)&np.isfinite(w)&(w>0)&(x>0)
              x=x[m]; w=w[m]
              med=wmedian(x,w)
              for belt,lo,hi in BELTS:
                  b,i,a=shares(x,w,med,lo,hi)
                  rows.append([year,endpoint_year,source,measure,status,belt,med,b,i,a,len(x),w.sum(),note])
              diagnostics.append([year,source,measure,len(x),w.sum(),med,status])
              print(year,source,measure,status,"median",round(med,2),"n",len(x),"weighted",round(w.sum()))
              return med

          def parse_num(series):
              x=series.astype(str).str.strip().str.strip("'").str.strip('"')
              x=x.replace({".":np.nan,"":np.nan,"nan":np.nan})
              return pd.to_numeric(x,errors="coerce")

          def ahs_zip(year):
              base=f"https://www2.census.gov/programs-surveys/ahs/{year}/"
              html=get(base).decode("utf-8","ignore")
              links=re.findall(r'href="([^"]+\.zip)"',html,re.I)
              cand=[x for x in links if "National" in x and "CSV" in x]
              pick=next((x for x in cand if "Flat" in x),cand[0])
              return urljoin(base,pick)

          # Census questionnaire value intervals; 1980 is interval-coded, not exact dollar value.
          VALUE80_MID={
            1:3500,2:6250,3:8750,4:11250,5:13750,6:16250,7:18750,
            8:21250,9:23750,10:26250,11:28750,12:32500,13:37500,
            14:42500,15:47500,16:52500,17:57500,18:62500,19:67500,
            20:72500,21:77500,22:85000,23:95000,24:112500,25:137500,
            26:175000,27:225000,28:275000,29:325000
          }

          for year,endpoint in [(1980,1980),(1989,1988),(1993,1992),(2001,2000)]:
              print("\n=== AHS",year,"for endpoint",endpoint,"===")
              z=zipfile.ZipFile(io.BytesIO(get(ahs_zip(year))))
              n=[x for x in z.namelist() if x.lower().endswith(".csv")][0]
              if year==1980:
                  want=["STATUS","VALUE","ZRENT","WEIGHT"]
              elif year in (1989,1993):
                  want=["STATUS","VALUE","RENT","AMTE","AMTG","AMTO","AMTF","AMTW","WEIGHT"]
              else:
                  want=["STATUS","VALUE","RENT","AMTE","AMTG","AMTO","AMTF","AMTW","WGT90GEO"]
              d=pd.read_csv(z.open(n),usecols=want,dtype=str,low_memory=False)
              d.columns=[c.upper() for c in d.columns]
              for c in d.columns: d[c]=parse_num(d[c])
              d=d[d.STATUS==1].copy()
              wcol="WGT90GEO" if year==2001 else "WEIGHT"

              if year==1980:
                  vc=d.VALUE.map(VALUE80_MID)
                  good=vc.notna()&(d[wcol]>0)
                  add(year,endpoint,"AHS","home_value_midpoint_sensitivity",vc[good],d.loc[good,wcol],
                      status="sensitivity_only",
                      note="1980 AHS VALUE is interval-coded; Census-style class midpoints used. Not a canonical exact observation.")
                  gr=d.ZRENT
                  good=gr.notna()&(gr>0)&(gr<9999)&(d[wcol]>0)
                  add(year,endpoint,"AHS","gross_rent",gr[good],d.loc[good,wcol],
                      note="Direct 1980 AHS gross-rent recode (ZRENT).")
              else:
                  val=d.VALUE
                  good=val.notna()&(val>0)&(d[wcol]>0)
                  add(year,endpoint,"AHS","home_value",val[good],d.loc[good,wcol],
                      note="Legacy AHS VALUE universe; source-specific restrictions may differ from modern ACS.")
                  cash=d[d.RENT.notna()&(d.RENT>0)&(d[wcol]>0)].copy()
                  for c in ["AMTE","AMTG","AMTO","AMTF","AMTW"]:
                      cash[c]=cash[c].where(cash[c]>=0,0).fillna(0)
                  cash["GROSS_RENT"]=cash.RENT+cash.AMTE+cash.AMTG+cash.AMTO/12+cash.AMTF/12+cash.AMTW/12
                  add(year,endpoint,"AHS","gross_rent",cash.GROSS_RENT,cash[wcol],
                      note="Constructed as contract rent plus separately paid utilities; oil/other fuel/water annual amounts divided by 12.")

          # Modern ACS canonical observations.
          for year,endpoint in [(2008,2008),(2016,2016),(2019,2020),(2021,2020),(2024,2024)]:
              print("\n=== ACS",year,"for endpoint",endpoint,"===")
              url=f"https://www2.census.gov/programs-surveys/acs/data/pums/{year}/1-Year/csv_hus.zip"
              z=zipfile.ZipFile(io.BytesIO(get(url)))
              need={"WGTP","TEN","VALP","GRNTP","ADJHSG"}
              fs=[]
              for n in z.namelist():
                  if not n.lower().endswith(".csv"): continue
                  q=pd.read_csv(z.open(n),usecols=lambda c:c.upper() in need,low_memory=False)
                  q.columns=[c.upper() for c in q.columns]
                  if need.issubset(q.columns): fs.append(q[list(need)])
              d=pd.concat(fs,ignore_index=True)
              for c in need: d[c]=pd.to_numeric(d[c],errors="coerce")
              adj=d.ADJHSG/1_000_000
              d["VALUE_ADJ"]=d.VALP*adj
              d["GRENT_ADJ"]=d.GRNTP*adj
              own=d[d.TEN.isin([1,2])&d.VALUE_ADJ.notna()&(d.VALUE_ADJ>0)&(d.WGTP>0)]
              rent=d[(d.TEN==3)&d.GRENT_ADJ.notna()&(d.GRENT_ADJ>0)&(d.WGTP>0)]
              if year==2019:
                  stat="pandemic_precheck"
                  note="2019 ACS pre-pandemic bookend for unavailable standard 2020 ACS 1-year observation."
              elif year==2021:
                  stat="pandemic_recovery"
                  note="2021 ACS recovery bookend for unavailable standard 2020 ACS 1-year observation."
              else:
                  stat="canonical"
                  note=""
              add(year,endpoint,"ACS","home_value",own.VALUE_ADJ,own.WGTP,status=stat,note=note)
              add(year,endpoint,"ACS","gross_rent",rent.GRENT_ADJ,rent.WGTP,status=stat,note=note)

          out=pd.DataFrame(rows,columns=[
            "observation_year","presidential_endpoint","source","measure","status","belt","median",
            "below_pct","inside_pct","above_pct","sample_n","weighted_units","note"])
          diag=pd.DataFrame(diagnostics,columns=["year","source","measure","sample_n","weighted_units","median","status"])
          print("\n===== FULL HISTORICAL RESULTS =====")
          print(out.to_csv(index=False,float_format="%.3f"))
          print("===== DIAGNOSTICS =====")
          print(diag.to_csv(index=False,float_format="%.3f"))
          out.to_csv("housing_distribution_full_history.csv",index=False,float_format="%.6f")
          diag.to_csv("housing_distribution_diagnostics.csv",index=False,float_format="%.6f")
          assert np.allclose(out.below_pct+out.inside_pct+out.above_pct,100,atol=.02)
          PY
          python /tmp/housing_history.py
      - name: Upload full history
        uses: actions/upload-artifact@v4
        with:
          name: housing-distribution-full-history
          path: |
            housing_distribution_full_history.csv
            housing_distribution_diagnostics.csv
