name: Inspect legacy AHS historical files

on:
  push:
    branches: [analysis/housing-distribution]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: python -m pip install --quiet pandas requests
      - name: Inspect 1980 1989 1993 2001 AHS archives and headers
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import io,re,zipfile,requests,pandas as pd
          from urllib.parse import urljoin
          years=[1980,1989,1993,2001]
          for year in years:
              base=f"https://www2.census.gov/programs-surveys/ahs/{year}/"
              html=requests.get(base,timeout=120).text
              links=re.findall(r'href="([^"]+\.zip)"',html,re.I)
              cand=[x for x in links if "National" in x and "CSV" in x]
              print("\n=====",year,"ZIP LINKS =====")
              print(cand[:20])
              # Prefer flat CSV, otherwise ordinary national CSV.
              pick=None
              for x in cand:
                  if "Flat" in x:
                      pick=x; break
              if pick is None and cand:
                  pick=cand[0]
              if not pick:
                  raise RuntimeError(f"No national CSV zip for {year}")
              url=urljoin(base,pick)
              print("PICK",url)
              z=zipfile.ZipFile(io.BytesIO(requests.get(url,timeout=240).content))
              print("FILES",z.namelist()[:30])
              for n in z.namelist():
                  if not n.lower().endswith(".csv"): continue
                  df=pd.read_csv(z.open(n),nrows=5,dtype=str)
                  cols=[c.upper() for c in df.columns]
                  print("\nFILE",n,"NCOLS",len(cols))
                  print("TARGET COLS",[c for c in cols if any(k in c for k in ["TENURE","STATUS","WEIGHT","WGT","VALUE","MARKET","RENT","AMTE","AMTG","AMTO","AMTF","AMTW","ELEC","GAS","OIL","OTHER","WATER"])][:200])
                  for c in df.columns:
                      cu=c.upper()
                      if cu in ["TENURE","STATUS","INTSTATUS","VALUE","MARKETVAL","RENT","WGT90GEO","WEIGHT","AMTE","AMTG","AMTO","AMTF","AMTW","ELECAMT","GASAMT","OILAMT","OTHERAMT","WATERAMT"]:
                          print(cu,[repr(x) for x in df[c].tolist()])
          PY
