name: Near-median income diagnostic

on:
  push:
    branches:
      - analysis/near-median-income
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect NBER March CPS dictionaries
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p diagnostic
          for yy in 01 09 17 21; do
            for ext in dct do; do
              url="https://www.nber.org/data/progs/cps/cpsmar${yy}.${ext}"
              echo "FETCH $url"
              curl -L --fail --retry 3 "$url" -o "diagnostic/cpsmar${yy}.${ext}" || true
            done
          done
          for f in diagnostic/*; do
            echo "===== $f ====="
            grep -Ein 'HTOTVAL|H_TOT|H_NUMPER|HNUMPER|MARSUPWT|H_SEQ|H_LIVQRT|H_TYPE|RECTYPE|RECORD' "$f" || true
          done
      - name: Upload diagnostic dictionaries
        uses: actions/upload-artifact@v4
        with:
          name: cps-dictionary-diagnostic
          path: diagnostic/
