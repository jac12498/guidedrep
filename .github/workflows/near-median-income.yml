name: Near-median income diagnostic

on:
  push:
    branches: [analysis/near-median-income]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect NBER record layouts
        shell: bash
        run: |
          set -euxo pipefail
          for yy in 01 09; do
            curl -LsSf "https://www.nber.org/data/progs/cps/cpsmar${yy}.dct" -o "cpsmar${yy}.dct"
            curl -LsSf "https://www.nber.org/data/progs/cps/cpsmar${yy}.do" -o "cpsmar${yy}.do"
            echo "===== $yy DICT TARGETS ====="
            grep -nEi 'hrecord|h_seq|h_numper|h_type |h_livqrt|hsup|htotval|precord|ph_seq|marsupwt' "cpsmar${yy}.dct" || true
            echo "===== $yy RECORD LABELS ====="
            grep -A15 -nEi '^label define (hrecord|precord|h_type|h_livqrt|p_stat)' "cpsmar${yy}.do" || true
            echo "===== $yy FIRST 12 DICT LINES ====="
            head -12 "cpsmar${yy}.dct"
          done
