name: Inspect 2017 ASEC layout

on:
  push:
    branches: [analysis/near-median-income]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print 2017 target fields
        shell: bash
        run: |
          curl -LsSf "https://www2.census.gov/programs-surveys/cps/datasets/2017/march/08ASEC2017_Data_Dict_Full.txt" -o /tmp/dict.txt
          grep -Ein 'HRECORD|H_SEQ|H_NUMPER|H_TYPE|H_LIVQRT|HTOTVAL|HSUP_WGT|PRECORD|PH_SEQ|MARSUPWT|HHSTATUS' /tmp/dict.txt || true
