name: Near-median income calculation

on:
  push:
    branches: [analysis/near-median-income]
  workflow_dispatch:

jobs:
  calculate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python dependencies
        run: python -m pip install --quiet pandas numpy pyreadr requests

      - name: Calculate presidential-change-year income belts
        shell: bash
        run: |
          cat > /tmp/calc.py <<'PY'
          import io, math, os, re, zipfile, requests
          import numpy as np
          import pandas as pd
          import pyreadr

          os.makedirs("results", exist_ok=True)
          session = requests.Session()
          session.headers.update({"User-Agent":"AEB-near-median-income-research/1.0"})

          ENDPOINTS = [
              (1980, 1981, "ipums", "jjchern/cpsmar1980s"),
              (1988, 1989, "ipums", "jjchern/cpsmar1980s"),
              (1992, 1993, "ipums", "jjchern/cpsmar1990s"),
              (2000, 2001, "nber", None),
              (2008, 2009, "nber", None),
              (2016, 2017, "nber", None),
              (2020, 2021, "census_csv", None),
              (2024, 2025, "census_csv", None),
              (2025, 2026, "census_csv", None),
          ]

          def weighted_median(x, w):
              x=np.asarray(x, dtype=float); w=np.asarray(w, dtype=float)
              mask=np.isfinite(x)&np.isfinite(w)&(w>0)
              x=x[mask]; w=w[mask]
              o=np.argsort(x, kind="mergesort"); x=x[o]; w=w[o]
              c=np.cumsum(w)
              return float(x[np.searchsorted(c, 0.5*w.sum(), side="left")])

          def shares(eq, w, median, lo, hi):
              eq=np.asarray(eq,dtype=float); w=np.asarray(w,dtype=float)
              mask=np.isfinite(eq)&np.isfinite(w)&(w>0)
              eq=eq[mask]; w=w[mask]; den=w.sum()
              below=w[eq < lo*median].sum()/den
              inside=w[(eq >= lo*median)&(eq <= hi*median)].sum()/den
              above=w[eq > hi*median].sum()/den
              return below, inside, above

          def summarize(year, persons, households, source, diagnostics):
              # Required columns:
              # persons: eq, pw
              # households: eq, hw
              pm=weighted_median(persons["eq"], persons["pw"])
              hm=weighted_median(households["eq"], households["hw"])
              rows=[]
              for name,lo,hi in [
                  ("near_median_90_110",0.90,1.10),
                  ("broader_80_120",0.80,1.20),
                  ("conventional_2_3_2x",2/3,2.0),
              ]:
                  pb,pi,pa=shares(persons["eq"], persons["pw"], pm, lo, hi)
                  hb,hi_s,ha=shares(persons["eq"], persons["pw"], hm, lo, hi)
                  rows.append({
                      "income_year":year,"source":source,"belt":name,
                      "person_weighted_median":pm,
                      "household_weighted_median":hm,
                      "median_difference_pct":100*(hm/pm-1),
                      "below_share_pct":100*pb,
                      "inside_share_pct":100*pi,
                      "above_share_pct":100*pa,
                      "inside_share_household_median_pct":100*hi_s,
                      "inside_sensitivity_pp":100*(hi_s-pi),
                  })
              diagnostics.append({
                  "income_year":year,"source":source,
                  "person_rows":len(persons),"household_rows":len(households),
                  "person_weight_sum":float(persons["pw"].sum()),
                  "household_weight_sum":float(households["hw"].sum()),
                  "eq_income_min":float(persons["eq"].min()),
                  "eq_income_max":float(persons["eq"].max()),
              })
              return rows

          def fetch(url):
              r=session.get(url,timeout=120)
              r.raise_for_status()
              return r.content

          def load_ipums(income_year, survey_year, repo):
              branch="master"
              url=f"https://raw.githubusercontent.com/{repo}/{branch}/data/cpsmar{survey_year}.rda"
              path=f"/tmp/cpsmar{survey_year}.rda"
              open(path,"wb").write(fetch(url))
              objs=pyreadr.read_r(path)
              if len(objs)!=1:
                  raise RuntimeError(f"Unexpected RDA objects for {survey_year}: {list(objs)}")
              df=next(iter(objs.values()))
              cols=["serial","numprec","gq","hhincome","hwtsupp","wtsupp"]
              missing=[c for c in cols if c not in df.columns]
              if missing: raise RuntimeError(f"Missing IPUMS columns {missing} in {survey_year}")
              d=df[cols].copy()
              for c in cols: d[c]=pd.to_numeric(d[c],errors="coerce")
              # IPUMS GQ general codes 1-2 are household units; codes >=3 are group quarters.
              d=d[(d.gq>0)&(d.gq<3)&(d.numprec>0)&d.hhincome.notna()]
              d["eq"]=d.hhincome/np.sqrt(d.numprec)
              persons=d[["eq","wtsupp"]].rename(columns={"wtsupp":"pw"}).dropna()
              hh=d.sort_values("serial").drop_duplicates("serial")[["eq","hwtsupp"]].rename(columns={"hwtsupp":"hw"}).dropna()
              print(f"IPUMS {survey_year}: gq frequencies original={df['gq'].value_counts(dropna=False).head(10).to_dict()}")
              return persons, hh

          def parse_dct(text):
              pos={}
              rgx=re.compile(r'_column\((\d+)\s*\)\s+\w+\s+(\w+)\s+%(\d+)(?:\.\d+)?[a-z]')
              for line in text.splitlines():
                  m=rgx.search(line)
                  if m:
                      pos[m.group(2).lower()]=(int(m.group(1)),int(m.group(3)))
              return pos

          def cut(line, spec):
              p,w=spec
              return line[p-1:p-1+w]

          def to_num(s, scale=1.0):
              s=s.strip()
              if not s: return np.nan
              try: return float(s)/scale
              except: return np.nan

          def load_nber(income_year, survey_year):
              yy=f"{survey_year%100:02d}"
              dct=fetch(f"https://www.nber.org/data/progs/cps/cpsmar{yy}.dct").decode("latin1")
              pos=parse_dct(dct)
              need=["hrecord","h_seq","h_numper","h_type","htotval","hsup_wgt","precord","ph_seq","marsupwt"]
              miss=[n for n in need if n not in pos]
              if miss: raise RuntimeError(f"NBER {yy} missing dict fields {miss}")
              zbytes=fetch(f"https://www.nber.org/cps/cpsmar{yy}.zip")
              z=zipfile.ZipFile(io.BytesIO(zbytes))
              datname=[n for n in z.namelist() if n.lower().endswith((".dat",".raw"))][0]
              raw_path=f"/tmp/cpsmar{yy}.dat"
              with z.open(datname) as src, open(raw_path,"wb") as dst:
                  while True:
                      chunk=src.read(8*1024*1024)
                      if not chunk: break
                      dst.write(chunk)
              hhs={}
              hh_rows=[]
              with open(raw_path,"r",encoding="latin1",errors="ignore") as fh:
                  for line in fh:
                      if line[:1]!="1": continue
                      seq=int(to_num(cut(line,pos["h_seq"])))
                      n=int(to_num(cut(line,pos["h_numper"])))
                      htype=int(to_num(cut(line,pos["h_type"])))
                      inc=to_num(cut(line,pos["htotval"]))
                      hw=to_num(cut(line,pos["hsup_wgt"]),100.0)
                      if htype in range(1,9) and n>0 and np.isfinite(inc) and np.isfinite(hw) and hw>0:
                          eq=inc/math.sqrt(n)
                          hhs[seq]=(eq,n,hw)
                          hh_rows.append((seq,eq,hw))
              people=[]
              with open(raw_path,"r",encoding="latin1",errors="ignore") as fh:
                  for line in fh:
                      if line[:1]!="3": continue
                      seq=int(to_num(cut(line,pos["ph_seq"])))
                      if seq not in hhs: continue
                      pw=to_num(cut(line,pos["marsupwt"]),100.0)
                      if np.isfinite(pw) and pw>0:
                          people.append((hhs[seq][0],pw))
              persons=pd.DataFrame(people,columns=["eq","pw"])
              hh=pd.DataFrame(hh_rows,columns=["serial","eq","hw"]).drop_duplicates("serial")[["eq","hw"]]
              print(f"NBER {survey_year}: households={len(hh):,}, persons={len(persons):,}, raw={datname}")
              return persons, hh

          def load_census_csv(income_year, survey_year):
              yy=f"{survey_year%100:02d}"
              url=f"https://www2.census.gov/programs-surveys/cps/datasets/{survey_year}/march/asecpub{yy}csv.zip"
              z=zipfile.ZipFile(io.BytesIO(fetch(url)))
              hhname=[n for n in z.namelist() if os.path.basename(n).lower().startswith("hhpub") and n.lower().endswith(".csv")][0]
              ppname=[n for n in z.namelist() if os.path.basename(n).lower().startswith("pppub") and n.lower().endswith(".csv")][0]
              hh=pd.read_csv(z.open(hhname),low_memory=False)
              pp=pd.read_csv(z.open(ppname),low_memory=False)
              hh.columns=[c.upper() for c in hh.columns]; pp.columns=[c.upper() for c in pp.columns]
              required_h=["H_SEQ","H_NUMPER","HTOTVAL","HSUP_WGT"]
              required_p=["PH_SEQ","MARSUPWT"]
              for c in required_h:
                  if c not in hh: raise RuntimeError(f"{survey_year} household missing {c}")
              for c in required_p:
                  if c not in pp: raise RuntimeError(f"{survey_year} person missing {c}")
              status="HHSTATUS" if "HHSTATUS" in hh.columns else None
              if status is None: raise RuntimeError(f"{survey_year} lacks HHSTATUS for GQ exclusion")
              for c in required_h+[status]: hh[c]=pd.to_numeric(hh[c],errors="coerce")
              for c in required_p: pp[c]=pd.to_numeric(pp[c],errors="coerce")
              h=hh[(hh[status]>0)&(hh.H_NUMPER>0)&hh.HTOTVAL.notna()&hh.HSUP_WGT.notna()& (hh.HSUP_WGT>0)].copy()
              h["eq"]=h.HTOTVAL/np.sqrt(h.H_NUMPER)
              # Household sequence number is the documented person-household link.
              map_eq=h.drop_duplicates("H_SEQ").set_index("H_SEQ")["eq"]
              p=pp[pp.PH_SEQ.isin(map_eq.index)&pp.MARSUPWT.notna()&(pp.MARSUPWT>0)].copy()
              p["eq"]=p.PH_SEQ.map(map_eq)
              persons=p[["eq","MARSUPWT"]].rename(columns={"MARSUPWT":"pw"}).dropna()
              house=h[["eq","HSUP_WGT"]].rename(columns={"HSUP_WGT":"hw"}).dropna()
              print(f"Census CSV {survey_year}: households={len(house):,}, persons={len(persons):,}, HHSTATUS={sorted(h[status].dropna().unique().tolist())}")
              return persons, house

          results=[]; diagnostics=[]
          for income_year,survey_year,kind,repo in ENDPOINTS:
              print(f"\n=== income {income_year} / ASEC {survey_year} / {kind} ===")
              if kind=="ipums":
                  p,h=load_ipums(income_year,survey_year,repo)
              elif kind=="nber":
                  p,h=load_nber(income_year,survey_year)
              else:
                  p,h=load_census_csv(income_year,survey_year)
              results.extend(summarize(income_year,p,h,kind,diagnostics))

          out=pd.DataFrame(results)
          diag=pd.DataFrame(diagnostics)
          out.to_csv("results/near_median_income.csv",index=False,float_format="%.6f")
          diag.to_csv("results/diagnostics.csv",index=False,float_format="%.6f")

          print("\n===== NEAR-MEDIAN RESULTS =====")
          print(out.to_csv(index=False,float_format="%.3f"))
          print("===== DIAGNOSTICS =====")
          print(diag.to_csv(index=False,float_format="%.3f"))

          # Internal arithmetic checks.
          assert np.allclose(out.below_share_pct+out.inside_share_pct+out.above_share_pct,100,atol=0.02)
          PY
          python /tmp/calc.py

      - name: Upload compact results
        uses: actions/upload-artifact@v4
        with:
          name: near-median-income-results
          path: results/
