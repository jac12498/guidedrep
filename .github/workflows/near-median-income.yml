name: Near-median income diagnostic

on:
  push:
    branches:
      - analysis/near-median-income
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Discover Census ASEC files and legacy NBER fields
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p diagnostic

          for yy in 01 09; do
            for ext in dct do; do
              url="https://www.nber.org/data/progs/cps/cpsmar${yy}.${ext}"
              curl -L --fail --retry 3 "$url" -o "diagnostic/cpsmar${yy}.${ext}"
            done
          done

          for year in 2017 2021 2025 2026; do
            url="https://www2.census.gov/programs-surveys/cps/datasets/${year}/march/"
            echo "===== DIRECTORY $year ====="
            curl -L --fail --retry 3 "$url" -o "diagnostic/census-${year}-index.html"
            grep -Eio 'href="[^"]+"' "diagnostic/census-${year}-index.html" | grep -Ei 'asec|csv|pubuse|ddl|fmt' || true
          done

          for f in diagnostic/cpsmar*.dct; do
            echo "===== $f ====="
            grep -Ein 'hrecord|h_seq|h_numper|h_type|h_livqrt|htotval|marsupwt|precord' "$f" || true
          done
      - name: Upload diagnostic files
        uses: actions/upload-artifact@v4
        with:
          name: cps-dictionary-diagnostic
          path: diagnostic/
