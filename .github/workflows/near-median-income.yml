name: Near-median income diagnostic

on:
  push:
    branches:
      - analysis/near-median-income
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect early March CPS layouts
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p diagnostic
          for yy in 81 89 93; do
            for ext in dct do; do
              url="https://www.nber.org/data/progs/cps/cpsmar${yy}.${ext}"
              echo "FETCH $url"
              curl -L --fail --retry 3 "$url" -o "diagnostic/cpsmar${yy}.${ext}"
            done
            echo "===== FIELDS $yy ====="
            grep -Ein 'hrecord|h_seq|h_numper|h_type|h_livqrt|htotval|hsup_wgt|marsupwt|precord|ph_seq' "diagnostic/cpsmar${yy}.dct" || true
            echo "===== LABELS $yy ====="
            grep -A18 -Ein '^label define h_type|^label define h_livqrt|^label define hrecord|^label define precord' "diagnostic/cpsmar${yy}.do" || true
          done
      - name: Upload diagnostic files
        uses: actions/upload-artifact@v4
        with:
          name: cps-early-layout-diagnostic
          path: diagnostic/
